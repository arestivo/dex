schema: spec-driven

context: |
  Dex, a Markdown slide engine. Published decks are static files on a plain static host:
  no server-side code, no URL rewriting. Any feature needing a backend (e.g. the
  planned per-slide discussions) must work as a separate service the static pages call.
  A slide's identity is (deck slug, slide id). Ids are permanent once published: never design
  changes that derive, rename or renumber them.
  Decks are authored by trusted staff and agents (raw HTML allowed); anything written by readers
  (e.g. discussions) is untrusted and must be sanitised.
  Agents recreate remark.js decks by hand (.agents/skills/migrate-remark-deck); do not plan an
  automatic converter unless asked.
  Biome must never process *.md or *.svg (memory blowup / front matter corruption).

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
